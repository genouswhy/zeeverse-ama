<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zeeverse-AMA</title>
  <meta name="description" content="Zeeverse community calls in English and Chinese, with the original transcripts.">
  <style>
    body { margin: 0; color: #183329; background: #f7faf7; font: 1rem/1.5 system-ui, sans-serif; }
    main { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    p { margin: 0; padding: .75rem 1rem; }
    a { color: #175a3f; }
    iframe { display: block; flex: 1; width: 100%; min-height: 0; border: 0; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <p id="archive-status" role="status">
      <span id="loading" hidden>Loading the archive… </span>
      <a id="archive-link" href="https://genouswhy.github.io/zeeverse-ama/">Open on GitHub Pages</a>
    </p>
    <iframe id="archive" title="Zeeverse-AMA archive"
      sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox" hidden></iframe>
  </main>
  <script>
    (() => {
      const frame = document.getElementById("archive");
      const status = document.getElementById("archive-status");
      const loading = document.getElementById("loading");
      const archiveLink = document.getElementById("archive-link");
      const published = new URL(archiveLink.href);
      const routePattern = /^(?:index\.html|zh\/index\.html|(?:(?:zh|transcripts)\/)?\d{4}-\d{2}-\d{2}\.html)$/;

      const indexRoute = (value) => {
        if (value === "zh" || value === "zh/") return "zh/index.html";
        return value || "index.html";
      };
      const current = new URL(location.href);
      const legacy = /^#\/(\d{4}-\d{2}-\d{2})(\/transcript)?\/?$/.exec(current.hash);
      const previousPage = legacy ? (legacy[2] ? "transcripts/" : "") + legacy[1] + ".html" : "";
      const route = indexRoute(current.searchParams.get("page") || previousPage || current.pathname.slice(1));
      const target = new URL(routePattern.test(route) ? route : "index.html", published);
      target.hash = legacy || current.hash === "#/" ? "" : current.hash;
      archiveLink.href = target.href;
      loading.hidden = false;

      window.addEventListener("message", (event) => {
        if (event.origin !== published.origin || event.source !== frame.contentWindow ||
            event.data?.type !== "zeeverse-ama:navigate" || typeof event.data.url !== "string") return;

        const loaded = new URL(event.data.url);
        if (loaded.origin !== published.origin || !loaded.pathname.startsWith(published.pathname)) return;
        const page = indexRoute(loaded.pathname.slice(published.pathname.length));
        if (!routePattern.test(page)) return;

        const share = new URL("/", location.href);
        if (page !== "index.html") share.searchParams.set("page", page);
        share.hash = loaded.hash;
        if (share.href !== location.href) history.replaceState(null, "", share);
        if (typeof event.data.title === "string") document.title = event.data.title;
        frame.hidden = false;
        status.hidden = true;
      });

      frame.addEventListener("load", () => {
        frame.hidden = false;
        loading.hidden = true;
      });
      window.addEventListener("keydown", (event) => {
        if (event.key !== "/" || event.altKey || event.ctrlKey || event.metaKey) return;
        const page = new URLSearchParams(location.search).get("page");
        if (page && !page.endsWith("index.html")) return;
        event.preventDefault();
        frame.contentWindow.postMessage("zeeverse-ama:focus-search", published.origin);
      });
      frame.src = target.href;
    })();
  </script>
</body>
</html>
